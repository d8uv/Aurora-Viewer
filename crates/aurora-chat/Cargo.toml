[package]
name = "aurora-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aurora-i18n = { path = "../aurora-i18n", default-features = false }
aurora-net = { path = "../aurora-net", default-features = false, features = ["chat"] }
aurora-version = { path = "../aurora-version" }
chrono = "0.4.45"
chrono-tz = "0.10.4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pin while using its opt-in wrapped-line counting API for transcript scrolling.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = "1.9.1"

[lints]
workspace = true
